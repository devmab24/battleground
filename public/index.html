<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Battleground</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>Battleground</h1>
    <p class="tagline">Type two fighters. Find out who wins.</p>
  </header>

  <main>
    <!-- View 1: input form (only view visible on load) -->
    <section id="view-form" class="view" aria-labelledby="form-title">
      <h2 id="form-title" class="visually-hidden">Choose your fighters</h2>
      <form id="fight-form" novalidate>
        <div class="fighters">
          <!-- No maxlength: a long paste would be cut off silently. script.js
               checks the 50-character limit and explains it instead. -->
          <label class="field">
            <span class="field-head">
              <span>Fighter A</span>
              <span class="char-count" id="count-a" aria-hidden="true">0/50</span>
            </span>
            <input id="fighter-a" name="fighterA" type="text" autocomplete="off" placeholder="e.g. 10 cows">
          </label>
          <span class="vs" aria-hidden="true">VS</span>
          <label class="field">
            <span class="field-head">
              <span>Fighter B</span>
              <span class="char-count" id="count-b" aria-hidden="true">0/50</span>
            </span>
            <input id="fighter-b" name="fighterB" type="text" autocomplete="off" placeholder="e.g. 10 lions">
          </label>
        </div>
        <p id="form-message" class="form-message" role="alert"></p>
        <button type="submit" class="btn btn-primary">Fight!</button>
      </form>
      <p class="view-links">
        <button type="button" class="btn btn-link" data-action="open-dex">BattleDex (<span class="dex-count">0</span>)</button>
      </p>
    </section>

    <!-- View 2: loading -->
    <section id="view-loading" class="view" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <!-- Rotating fun lines are visual only; screen readers get one announcement. -->
      <p id="loading-text" class="loading-text" aria-hidden="true">Fighters entering the arena…</p>
      <p id="loading-status" class="visually-hidden" role="status"></p>
    </section>

    <!-- View 3: result -->
    <section id="view-result" class="view" hidden aria-labelledby="result-title">
      <h2 id="result-title">Winner: <span id="winner-name"></span></h2>
      <div class="cards">
        <figure class="card" id="card-a">
          <img id="image-a" alt="">
          <figcaption id="label-a"></figcaption>
          <p id="note-a" class="image-note"></p>
          <button type="button" class="btn btn-small" data-action="save-fighter" data-side="a">Save to BattleDex</button>
          <p class="save-message" data-save-message="a" role="status"></p>
        </figure>
        <figure class="card" id="card-b">
          <img id="image-b" alt="">
          <figcaption id="label-b"></figcaption>
          <p id="note-b" class="image-note"></p>
          <button type="button" class="btn btn-small" data-action="save-fighter" data-side="b">Save to BattleDex</button>
          <p class="save-message" data-save-message="b" role="status"></p>
        </figure>
      </div>
      <p id="reasoning" class="reasoning"></p>
      <div class="actions">
        <button type="button" class="btn" data-action="new-fight">New fight</button>
        <button type="button" class="btn" data-action="open-dex">BattleDex (<span class="dex-count">0</span>)</button>
      </div>
    </section>

    <!-- View 4: error -->
    <section id="view-error" class="view" hidden role="alert">
      <h2 id="error-title">No decision!</h2>
      <p id="error-text">The fight fizzled out before anyone landed a punch. Ring the bell and try again!</p>
      <button type="button" class="btn" data-action="new-fight">Try again</button>
    </section>

    <!-- View 5: BattleDex (saved fighters, kept in localStorage) -->
    <section id="view-dex" class="view" hidden aria-labelledby="dex-title">
      <h2 id="dex-title">BattleDex</h2>
      <p id="dex-empty" class="dex-empty">No fighters saved yet. Win or lose, save a fighter from any fight result.</p>
      <ul id="dex-grid" class="dex-grid"></ul>
      <p id="dex-message" class="save-message" role="status"></p>
      <div class="actions">
        <button type="button" class="btn" data-action="last-fight" id="btn-last-fight" hidden>Back to last fight</button>
        <button type="button" class="btn btn-primary" data-action="new-fight">New fight</button>
        <button type="button" class="btn btn-danger" data-action="clear-dex" id="btn-clear-dex" hidden>Clear all</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
