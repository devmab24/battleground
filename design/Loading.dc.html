<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Battleground — The griots deliberate</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&amp;family=Bungee&amp;family=Silkscreen:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1C110B}
a{color:#F2B233}a:hover{color:#FFD36E}
.bg-zig{background-color:#1C110B;background-image:linear-gradient(135deg,#25170E 25%,transparent 25%),linear-gradient(225deg,#25170E 25%,transparent 25%),linear-gradient(315deg,#25170E 25%,transparent 25%),linear-gradient(45deg,#25170E 25%,transparent 25%);background-size:48px 48px;background-position:-24px 0,-24px 0,0 0,0 0}
.kente{background-image:repeating-linear-gradient(0deg,transparent 0 5px,rgba(26,15,10,.38) 5px 8px),repeating-linear-gradient(90deg,#F2B233 0 34px,#1A0F0A 34px 40px,#1E8A4F 40px 64px,#1A0F0A 64px 70px,#D2552A 70px 94px,#1A0F0A 94px 100px,#F2B233 100px 112px,#1E8A4F 112px 118px)}
.kente-run{animation:weave 1.2s linear infinite}
.dots{background-color:#E9D5AE;background-image:radial-gradient(circle,#C9AE7E 3px,transparent 3.5px);background-size:18px 18px}
.title-arcade{color:#F2B233;-webkit-text-stroke:3px #1A0F0A;paint-order:stroke fill;text-shadow:4px 4px 0 #D2552A,8px 8px 0 #1A0F0A}
.title-bone{color:#F3E3C3;-webkit-text-stroke:3px #1A0F0A;paint-order:stroke fill;text-shadow:5px 5px 0 #1A0F0A}
.btn-press{transition:transform .08s ease,box-shadow .08s ease}
.btn-press:hover{transform:translate(-2px,-2px);box-shadow:9px 9px 0 #1A0F0A !important}
.ring-a{animation:spin 6s linear infinite}
.ring-b{animation:spin 3.5s linear infinite reverse}
.ring-c{animation:spin 9s linear infinite}
.qmark{animation:breathe 1.4s ease-in-out infinite}
.shimmer{background:linear-gradient(110deg,transparent 30%,rgba(255,246,226,.65) 50%,transparent 70%);background-size:250% 100%;animation:shine 1.8s linear infinite}
.beat{animation:beat 0.9s ease-in-out infinite;transform-origin:bottom}
.beat:nth-child(2){animation-delay:.15s}.beat:nth-child(3){animation-delay:.3s}.beat:nth-child(4){animation-delay:.45s}.beat:nth-child(5){animation-delay:.6s}
.line-in{animation:rise .35s ease-out}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.35;transform:scale(.92)}50%{opacity:1;transform:scale(1.05)}}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
@keyframes beat{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes weave{to{background-position:0 0,118px 0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ring-a,.ring-b,.ring-c,.qmark,.shimmer,.beat,.kente-run,.line-in{animation:none}}
</style>
</helmet>
<div class="bg-zig" style="min-height: 100vh; display: flex; flex-direction: column; font-family: Archivo, system-ui, sans-serif; color: #F3E3C3">

  <header style="display: flex; flex-direction: column">
    <div class="kente kente-run" style="height: 18px; border-bottom: 4px solid #1A0F0A"></div>
    <div style="width: 100%; max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: 20px 24px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
      <a href="Main.dc.html" style="text-decoration: none; display: flex; align-items: center; gap: 14px">
        <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="25" fill="#D2552A" stroke="#1A0F0A" stroke-width="4"></circle><circle cx="28" cy="28" r="16" fill="#F2B233" stroke="#1A0F0A" stroke-width="3"></circle><path d="M28 17 L37 28 L28 39 L19 28 Z" fill="#1A0F0A"></path><path d="M28 3 V10 M28 46 V53 M3 28 H10 M46 28 H53" stroke="#1A0F0A" stroke-width="4"></path></svg>
        <span style="display: flex; flex-direction: column; gap: 4px">
          <span class="title-arcade" style="font-family: Bungee, sans-serif; font-size: 34px; line-height: 1">BATTLEGROUND</span>
          <span style="font-family: Silkscreen, monospace; font-size: 13px; letter-spacing: 0.14em; color: #E8D6B0">ARENA OF THE ANCIENTS</span>
        </span>
      </a>
      <span style="font-family: Silkscreen, monospace; font-size: 14px; letter-spacing: 0.12em; color: #F2B233">● FIGHT IN PROGRESS</span>
    </div>
  </header>

  <main style="flex: 1; width: 100%; max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: 16px 24px 64px; display: flex; flex-direction: column; align-items: center; gap: 32px">

    <section style="width: 100%; box-sizing: border-box; background: #2B1A10; border: 5px solid #1A0F0A; box-shadow: 12px 12px 0 #1A0F0A; display: flex; flex-direction: column">
      <div class="kente kente-run" style="height: 14px; border-bottom: 4px solid #1A0F0A"></div>
      <div style="padding: 36px 32px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 32px">

        <div style="flex: 1 1 240px; max-width: 300px; display: flex; flex-direction: column; align-items: stretch; gap: 0; border: 4px solid #1A0F0A; box-shadow: 6px 6px 0 #1A0F0A">
          <div class="dots" style="position: relative; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; overflow: hidden; border-bottom: 4px solid #1A0F0A">
            <div class="shimmer" style="position: absolute; inset: 0"></div>
            <span class="qmark" style="position: relative; font-family: Bungee, sans-serif; font-size: 110px; line-height: 1; color: #6F8BFF; -webkit-text-stroke: 4px #1A0F0A; paint-order: stroke fill">?</span>
          </div>
          <div style="padding: 12px 14px; background: #6F8BFF; color: #1A0F0A; display: flex; flex-direction: column; gap: 4px">
            <span style="font-family: Silkscreen, monospace; font-size: 13px; letter-spacing: 0.1em">FIGHTER A · WEST GATE</span>
            <span style="font-family: Bungee, sans-serif; font-size: 24px; line-height: 1.1">HONEY BADGER</span>
          </div>
          <div style="padding: 8px 14px; background: #1A0F0A; font-family: Silkscreen, monospace; font-size: 13px; color: #E8D6B0">PAINTING PORTRAIT…</div>
        </div>

        <div role="status" aria-live="polite" style="flex: 0 1 360px; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center">
          <div aria-hidden="true" style="position: relative; width: 190px; height: 190px">
            <div class="ring-c" style="position: absolute; inset: 0; border-radius: 50%; background: repeating-conic-gradient(#F2B233 0 8deg, #1A0F0A 8deg 15deg); border: 4px solid #1A0F0A"></div>
            <div style="position: absolute; inset: 18px; border-radius: 50%; background: #1A0F0A"></div>
            <div class="ring-a" style="position: absolute; inset: 26px; border-radius: 50%; border: 8px dashed #D2552A"></div>
            <div class="ring-b" style="position: absolute; inset: 50px; border-radius: 50%; border: 6px solid #1E8A4F; border-top-color: #F3E3C3; border-bottom-color: #F3E3C3"></div>
            <div style="position: absolute; inset: 72px; display: flex; align-items: center; justify-content: center">
              <svg width="46" height="46" viewBox="0 0 46 46"><path d="M23 2 L44 23 L23 44 L2 23 Z" fill="#F2B233" stroke="#F3E3C3" stroke-width="3"></path><path d="M23 13 L33 23 L23 33 L13 23 Z" fill="#1A0F0A"></path></svg>
            </div>
          </div>
          <h1 class="title-arcade" style="margin: 0; font-family: Bungee, sans-serif; font-size: 34px; line-height: 1.05; font-weight: 400">THE GRIOTS<br>DELIBERATE</h1>
          <p class="line-in" style="margin: 0; min-height: 56px; font-size: 20px; font-weight: 600; line-height: 1.4; color: #F3E3C3">{{line}}</p>
          <div aria-hidden="true" style="display: flex; align-items: flex-end; gap: 8px; height: 40px">
            <span class="beat" style="display: block; width: 14px; height: 40px; background: #F2B233; border: 3px solid #1A0F0A"></span>
            <span class="beat" style="display: block; width: 14px; height: 40px; background: #D2552A; border: 3px solid #1A0F0A"></span>
            <span class="beat" style="display: block; width: 14px; height: 40px; background: #1E8A4F; border: 3px solid #1A0F0A"></span>
            <span class="beat" style="display: block; width: 14px; height: 40px; background: #D2552A; border: 3px solid #1A0F0A"></span>
            <span class="beat" style="display: block; width: 14px; height: 40px; background: #F2B233; border: 3px solid #1A0F0A"></span>
          </div>
        </div>

        <div style="flex: 1 1 240px; max-width: 300px; display: flex; flex-direction: column; align-items: stretch; gap: 0; border: 4px solid #1A0F0A; box-shadow: 6px 6px 0 #1A0F0A">
          <div class="dots" style="position: relative; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; overflow: hidden; border-bottom: 4px solid #1A0F0A">
            <div class="shimmer" style="position: absolute; inset: 0"></div>
            <span class="qmark" style="position: relative; font-family: Bungee, sans-serif; font-size: 110px; line-height: 1; color: #E8673A; -webkit-text-stroke: 4px #1A0F0A; paint-order: stroke fill">?</span>
          </div>
          <div style="padding: 12px 14px; background: #E8673A; color: #1A0F0A; display: flex; flex-direction: column; gap: 4px">
            <span style="font-family: Silkscreen, monospace; font-size: 13px; letter-spacing: 0.1em">FIGHTER B · EAST GATE</span>
            <span style="font-family: Bungee, sans-serif; font-size: 24px; line-height: 1.1">LION</span>
          </div>
          <div style="padding: 8px 14px; background: #1A0F0A; font-family: Silkscreen, monospace; font-size: 13px; color: #E8D6B0">PAINTING PORTRAIT…</div>
        </div>
      </div>
    </section>

    <p style="margin: 0; max-width: 620px; text-align: center; font-size: 16px; line-height: 1.5; color: #CDB894">The verdict and both portraits are being prepared at the same time. This usually takes a few seconds.</p>
  </main>

  <div class="kente kente-run" style="height: 18px; border-top: 4px solid #1A0F0A"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":960}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0 };
    this.lines = [
      'Consulting the ancient scrolls…',
      'Tuning the talking drums…',
      'Sweeping the sand from the arena floor…',
      'Sharpening spears and claws alike…',
      'The elders are arguing about the rules (there are none)…',
      'Honey badger is cracking their knuckles…',
      'Lion is doing suspicious stretches…',
      'The crowd is chanting for Honey badger…',
      'Polishing the bronze champion’s mask…',
      'Sizing up Honey badger vs Lion…'
    ];
  }
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ i: (this.state.i + 1) % this.lines.length }), 1800);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    return { line: this.lines[this.state.i] };
  }
}
</script>
</body>
</html>
