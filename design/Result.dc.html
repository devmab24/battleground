<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Battleground — The verdict</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&amp;family=Bungee&amp;family=Silkscreen:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1C110B}
a{color:#F2B233}a:hover{color:#FFD36E}
.bg-zig{background-color:#1C110B;background-image:linear-gradient(135deg,#25170E 25%,transparent 25%),linear-gradient(225deg,#25170E 25%,transparent 25%),linear-gradient(315deg,#25170E 25%,transparent 25%),linear-gradient(45deg,#25170E 25%,transparent 25%);background-size:48px 48px;background-position:-24px 0,-24px 0,0 0,0 0}
.kente{background-image:repeating-linear-gradient(0deg,transparent 0 5px,rgba(26,15,10,.38) 5px 8px),repeating-linear-gradient(90deg,#F2B233 0 34px,#1A0F0A 34px 40px,#1E8A4F 40px 64px,#1A0F0A 64px 70px,#D2552A 70px 94px,#1A0F0A 94px 100px,#F2B233 100px 112px,#1E8A4F 112px 118px)}
.dots-gold{background-color:#F2B233;background-image:radial-gradient(circle,#D99A1E 3px,transparent 3.5px);background-size:18px 18px}
.dots-indigo{background-color:#6F8BFF;background-image:radial-gradient(circle,#5873E0 3px,transparent 3.5px);background-size:18px 18px}
.dots-laterite{background-color:#E8673A;background-image:radial-gradient(circle,#C9532A 3px,transparent 3.5px);background-size:18px 18px}
.title-arcade{color:#F2B233;-webkit-text-stroke:4px #1A0F0A;paint-order:stroke fill;text-shadow:5px 5px 0 #D2552A,10px 10px 0 #1A0F0A}
.btn-press{transition:transform .08s ease,box-shadow .08s ease}
.btn-press:hover{transform:translate(-2px,-2px);box-shadow:9px 9px 0 #1A0F0A !important}
.btn-press:active{transform:translate(4px,4px);box-shadow:2px 2px 0 #1A0F0A !important}
.pixel{image-rendering:pixelated;image-rendering:crisp-edges}
.sunburst{background:repeating-conic-gradient(rgba(242,178,51,.55) 0 9deg,transparent 9deg 22deg);border-radius:50%;-webkit-mask-image:radial-gradient(circle,#000 35%,transparent 70%);mask-image:radial-gradient(circle,#000 35%,transparent 70%)}
.anim .sunburst{animation:spin 16s linear infinite}
.win-card{box-shadow:0 0 0 5px #1A0F0A,0 0 46px 12px rgba(242,178,51,.65),14px 14px 0 5px #1A0F0A}
.anim .win-card{animation:glow 1.8s ease-in-out infinite}
.anim .win-drop{animation:drop .7s cubic-bezier(.2,1.6,.4,1) both}
.anim .win-title{animation:slam .55s cubic-bezier(.2,1.5,.4,1) both}
.anim .sparkle{animation:twinkle 1.4s ease-in-out infinite}
.anim .sparkle.s2{animation-delay:.45s}.anim .sparkle.s3{animation-delay:.9s}
.lose-card{box-shadow:8px 8px 0 #1A0F0A;filter:grayscale(.85) brightness(.72)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 5px #1A0F0A,0 0 30px 6px rgba(242,178,51,.45),14px 14px 0 5px #1A0F0A}50%{box-shadow:0 0 0 5px #1A0F0A,0 0 70px 22px rgba(242,178,51,.9),14px 14px 0 5px #1A0F0A}}
@keyframes drop{from{opacity:0;transform:translateY(-40px) scale(1.2)}to{opacity:1;transform:none}}
@keyframes slam{from{opacity:0;transform:scale(2.2)}to{opacity:1;transform:none}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(45deg)}}
@media (prefers-reduced-motion:reduce){.anim .sunburst,.anim .win-card,.anim .win-drop,.anim .win-title,.anim .sparkle{animation:none}}
</style>
</helmet>
<div class="bg-zig {{animClass}}" style="min-height: 100vh; overflow-x: clip; display: flex; flex-direction: column; font-family: Archivo, system-ui, sans-serif; color: #F3E3C3">

  <header style="display: flex; flex-direction: column">
    <div class="kente" style="height: 18px; border-bottom: 4px solid #1A0F0A"></div>
    <div style="width: 100%; max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: 20px 24px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
      <a href="Main.dc.html" style="text-decoration: none; display: flex; align-items: center; gap: 14px">
        <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="25" fill="#D2552A" stroke="#1A0F0A" stroke-width="4"></circle><circle cx="28" cy="28" r="16" fill="#F2B233" stroke="#1A0F0A" stroke-width="3"></circle><path d="M28 17 L37 28 L28 39 L19 28 Z" fill="#1A0F0A"></path><path d="M28 3 V10 M28 46 V53 M3 28 H10 M46 28 H53" stroke="#1A0F0A" stroke-width="4"></path></svg>
        <span style="display: flex; flex-direction: column; gap: 4px">
          <span class="title-arcade" style="font-family: Bungee, sans-serif; font-size: 34px; line-height: 1; -webkit-text-stroke: 3px #1A0F0A; text-shadow: 4px 4px 0 #D2552A, 8px 8px 0 #1A0F0A">BATTLEGROUND</span>
          <span style="font-family: Silkscreen, monospace; font-size: 13px; letter-spacing: 0.14em; color: #E8D6B0">ARENA OF THE ANCIENTS</span>
        </span>
      </a>
      <a href="Dex.dc.html" class="btn-press" style="display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 18px; background: #F3E3C3; color: #1A0F0A; border: 4px solid #1A0F0A; box-shadow: 6px 6px 0 #1A0F0A; font-family: Bungee, sans-serif; font-size: 16px; text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="2" y="3" width="18" height="16" fill="none" stroke="#1A0F0A" stroke-width="3"></rect><path d="M2 9 H20 M8 9 V19" stroke="#1A0F0A" stroke-width="3"></path></svg>
        BattleDex
        <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; padding: 0 6px; box-sizing: border-box; background: #1A0F0A; color: #F2B233; font-family: Silkscreen, monospace; font-size: 14px">{{dexCount}}</span>
      </a>
    </div>
  </header>

  <main style="flex: 1; width: 100%; max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: 8px 24px 64px; display: flex; flex-direction: column; align-items: center; gap: 40px">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
      <p style="margin: 0; font-family: Silkscreen, monospace; font-size: 15px; letter-spacing: 0.2em; color: #F2B233">◆ THE GRIOT HAS SPOKEN ◆</p>
      <h1 class="win-title title-arcade" style="margin: 0; font-family: Bungee, sans-serif; font-size: clamp(44px, 7.5vw, 88px); line-height: 1; font-weight: 400">{{winnerName}} WINS!</h1>
    </div>

    <div style="width: 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 56px 64px; padding: 20px 0">
      <sc-for list="{{fighters}}" as="f" hint-placeholder-count="2">
        <div style="position: relative; flex: 0 1 {{f.basis}}; min-width: 0; order: {{f.order}}">
          <sc-if value="{{f.isWinner}}" hint-placeholder-val="{{ true }}">
            <div class="sunburst" aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 760px; height: 760px; margin: -380px 0 0 -380px; pointer-events: none"></div>
            <svg class="sparkle" aria-hidden="true" width="34" height="34" viewBox="0 0 34 34" style="position: absolute; top: -18px; left: -30px"><path d="M17 0 L21 13 L34 17 L21 21 L17 34 L13 21 L0 17 L13 13 Z" fill="#FFE08A" stroke="#1A0F0A" stroke-width="2"></path></svg>
            <svg class="sparkle s2" aria-hidden="true" width="26" height="26" viewBox="0 0 34 34" style="position: absolute; top: 120px; right: -36px"><path d="M17 0 L21 13 L34 17 L21 21 L17 34 L13 21 L0 17 L13 13 Z" fill="#FFE08A" stroke="#1A0F0A" stroke-width="2"></path></svg>
            <svg class="sparkle s3" aria-hidden="true" width="22" height="22" viewBox="0 0 34 34" style="position: absolute; bottom: 70px; left: -34px"><path d="M17 0 L21 13 L34 17 L21 21 L17 34 L13 21 L0 17 L13 13 Z" fill="#FFE08A" stroke="#1A0F0A" stroke-width="2"></path></svg>
          </sc-if>

          <figure class="{{f.cardClass}}" style="position: relative; margin: 0; display: flex; flex-direction: column; background: #1A0F0A; border: {{f.border}}">
            <sc-if value="{{f.isWinner}}" hint-placeholder-val="{{ true }}">
              <div style="position: absolute; top: -34px; left: 0; right: 0; z-index: 2; display: flex; justify-content: center">
                <div class="win-drop" style="display: flex; align-items: center; gap: 10px; padding: 8px 20px; background: #F2B233; color: #1A0F0A; border: 4px solid #1A0F0A; box-shadow: 5px 5px 0 #1A0F0A; font-family: Bungee, sans-serif; font-size: 22px; white-space: nowrap">
                  <svg width="30" height="24" viewBox="0 0 30 24" aria-hidden="true"><path d="M2 21 L4 6 L10 12 L15 2 L20 12 L26 6 L28 21 Z" fill="#1A0F0A"></path><rect x="2" y="19" width="26" height="4" fill="#1A0F0A"></rect></svg>
                  CHAMPION
                </div>
              </div>
            </sc-if>
            <div class="{{f.artBg}}" style="position: relative; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; border-bottom: 4px solid #1A0F0A; overflow: hidden">
              <img class="pixel" src="{{f.img}}" alt="Art of {{f.name}}" style="width: 84%; height: 84%; object-fit: contain">
              <sc-if value="{{f.isLoser}}" hint-placeholder-val="{{ false }}">
                <span aria-hidden="true" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-14deg); padding: 6px 16px; border: 5px solid #B0361A; color: #B0361A; background: rgba(255,246,226,0.85); font-family: Bungee, sans-serif; font-size: 34px; letter-spacing: 0.04em">DEFEATED</span>
              </sc-if>
            </div>
            <figcaption style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; background: {{f.plate}}; color: #1A0F0A">
              <span style="display: flex; flex-direction: column; gap: 4px">
                <span style="font-family: Silkscreen, monospace; font-size: 13px; letter-spacing: 0.1em">{{f.sideLabel}}</span>
                <span style="font-family: Bungee, sans-serif; font-size: {{f.nameSize}}; line-height: 1.05">{{f.nameUpper}}</span>
              </span>
              <sc-if value="{{f.notSaved}}" hint-placeholder-val="{{ true }}">
                <button type="button" onClick="{{f.save}}" class="btn-press" style="align-self: flex-start; min-height: 44px; padding: 0 16px; display: inline-flex; align-items: center; gap: 8px; background: #F3E3C3; color: #1A0F0A; border: 3px solid #1A0F0A; box-shadow: 4px 4px 0 #1A0F0A; font-family: Archivo, sans-serif; font-weight: 800; font-size: 15px; cursor: pointer">
                  <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2 V14 M2 8 H14" stroke="#1A0F0A" stroke-width="3"></path></svg>
                  Save to BattleDex
                </button>
              </sc-if>
              <sc-if value="{{f.saved}}" hint-placeholder-val="{{ false }}">
                <p role="status" style="margin: 0; align-self: flex-start; min-height: 44px; padding: 0 16px; display: inline-flex; align-items: center; gap: 8px; background: #1A0F0A; color: #F3E3C3; border: 3px solid #1A0F0A; font-weight: 800; font-size: 15px">
                  <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8 L6 12 L14 3" fill="none" stroke="#7BE0A0" stroke-width="3"></path></svg>
                  Saved to BattleDex
                </p>
              </sc-if>
            </figcaption>
          </figure>
        </div>
      </sc-for>
    </div>

    <section aria-labelledby="tale" style="width: 100%; max-width: 820px; display: flex; flex-direction: column">
      <div aria-hidden="true" style="height: 18px; margin: 0 -14px; background: #5A3218; border: 4px solid #1A0F0A; border-radius: 10px; box-shadow: 5px 5px 0 #1A0F0A"></div>
      <div style="background: #F3E3C3; color: #1A0F0A; border-left: 4px solid #1A0F0A; border-right: 4px solid #1A0F0A; padding: 26px 34px 30px; display: flex; flex-direction: column; gap: 12px; background-image: linear-gradient(90deg, rgba(90,50,24,0.10), transparent 12%, transparent 88%, rgba(90,50,24,0.10))">
        <h2 id="tale" style="margin: 0; display: flex; align-items: center; gap: 10px; font-family: Silkscreen, monospace; font-size: 15px; font-weight: 700; letter-spacing: 0.16em; color: #7A3A12">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 1 L17 9 L9 17 L1 9 Z" fill="#D2552A" stroke="#1A0F0A" stroke-width="2"></path></svg>
          THE GRIOT’S TALE
        </h2>
        <p style="margin: 0; font-size: 20px; line-height: 1.6">{{reasoning}}</p>
      </div>
      <div aria-hidden="true" style="height: 18px; margin: 0 -14px; background: #5A3218; border: 4px solid #1A0F0A; border-radius: 10px; box-shadow: 5px 5px 0 #1A0F0A"></div>
    </section>

    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px">
      <a href="Main.dc.html" class="btn-press" style="display: inline-flex; align-items: center; min-height: 56px; padding: 0 30px; background: #F2B233; color: #1A0F0A; border: 5px solid #1A0F0A; box-shadow: 7px 7px 0 #1A0F0A; font-family: Bungee, sans-serif; font-size: 22px; text-decoration: none">NEW FIGHT</a>
      <a href="Dex.dc.html" class="btn-press" style="display: inline-flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 26px; background: #2B1A10; color: #F3E3C3; border: 5px solid #1A0F0A; box-shadow: 7px 7px 0 #1A0F0A; font-family: Bungee, sans-serif; font-size: 22px; text-decoration: none">BATTLEDEX ({{dexCount}})</a>
    </div>
  </main>

  <div class="kente" style="height: 18px; border-top: 4px solid #1A0F0A"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"winner":{"editor":"enum","options":["A","B"],"default":"B"},"celebrate":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":1240}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { savedA: false, savedB: false };
  }
  renderVals() {
    const winner = this.props.winner ?? 'B';
    const celebrate = this.props.celebrate ?? true;
    const base = [
      { side: 'A', name: 'Honey badger', img: '/_blob/e2b6b451a3385b42d35262b703003be0', sideLabel: 'FIGHTER A · WEST GATE', plateSide: '#6F8BFF', artSide: 'dots-indigo' },
      { side: 'B', name: 'Lion', img: '/_blob/3d6115fe9a502003c6227b70ab8921f7', sideLabel: 'FIGHTER B · EAST GATE', plateSide: '#E8673A', artSide: 'dots-laterite' }
    ];
    const fighters = base.map((f) => {
      const isWinner = f.side === winner;
      const saved = f.side === 'A' ? this.state.savedA : this.state.savedB;
      return {
        name: f.name,
        nameUpper: f.name.toUpperCase(),
        img: f.img,
        isWinner,
        isLoser: !isWinner,
        sideLabel: isWinner ? f.sideLabel + ' · VICTOR' : f.sideLabel,
        basis: isWinner ? '400px' : '290px',
        nameSize: isWinner ? '32px' : '24px',
        order: f.side === 'A' ? 1 : 3,
        cardClass: isWinner ? 'win-card' : 'lose-card',
        border: isWinner ? '6px solid #F2B233' : '4px solid #1A0F0A',
        artBg: isWinner ? 'dots-gold' : f.artSide,
        plate: isWinner ? '#FFE08A' : f.plateSide,
        saved,
        notSaved: !saved,
        save: () => this.setState(f.side === 'A' ? { savedA: true } : { savedB: true })
      };
    });
    const w = fighters.find((f) => f.isWinner);
    const reasoning = winner === 'B'
      ? 'The honey badger charged in with legendary stubbornness and no fear at all, but courage only goes so far against four hundred pounds of muscle. One swipe of the lion’s paw sent it tumbling, and the lion pinned it before it could find a soft spot to bite.'
      : 'The lion struck first, but the honey badger’s thick, loose hide shrugged off the bite and it twisted free every time. After a dozen rounds of being nipped, clawed and outlasted, the lion decided this meal was not worth it and left the arena.';
    return {
      fighters,
      winnerName: w.nameUpper,
      reasoning,
      animClass: celebrate ? 'anim' : '',
      dexCount: 6 + (this.state.savedA ? 1 : 0) + (this.state.savedB ? 1 : 0)
    };
  }
}
</script>
</body>
</html>
